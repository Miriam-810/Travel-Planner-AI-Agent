[project]
name = "travel-planner-backend"
version = "0.1.0"
description = "FastAPI backend and agent loop for the Travel Planner AI Agent"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.0",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
